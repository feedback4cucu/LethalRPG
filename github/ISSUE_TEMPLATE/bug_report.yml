name: Bug report
description: Something in LethalRPG does not work as described, or LethalRPG breaks the game.
title: "[Bug]: "
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting! Please check **Known issues & limitations** in the [wiki](https://thunderstore.io/c/lethal-company/p/Cucumis/LethalRPG/wiki/) first.

        **Privacy:** everything you write here is public. The `rpg report` file leaves out player names, Steam IDs and your Windows user folder. `LogOutput.log` does not: if you attach it, replace Steam names and paths like `C:\Users\<name>` first.
  - type: input
    id: version
    attributes:
      label: LethalRPG version
      description: "In the bug report ('rpg report'), under VERSIONS: the line 'LethalRPG 0.7.1+a1b2c3d, protocol 1'. Copy the version with its build, e.g. 0.7.1+a1b2c3d"
      placeholder: 0.7.1+a1b2c3d
    validations:
      required: true
  - type: dropdown
    id: role
    attributes:
      label: Your role
      options:
        - Host
        - Client
        - Singleplayer
    validations:
      required: true
  - type: dropdown
    id: network
    attributes:
      label: Steam or LAN
      options:
        - Steam
        - LAN
    validations:
      required: true
  - type: input
    id: players
    attributes:
      label: Players in the lobby
      description: How many, and do all of them have LethalRPG?
      placeholder: 3, all with LethalRPG
  - type: textarea
    id: rules
    attributes:
      label: Host settings
      description: "In the host's bug report ('rpg report'), under SESSION: the line 'Rules: ...'. The settings the host changed are under 'CONFIG OF THIS PC' in the same report."
      placeholder: "Rules: SurplusShare 50% ByContribution, Individual, skills Xp, Normal/Standard"
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What you did, what happened, and what you expected instead. Steps to make it happen again help a lot.
    validations:
      required: true
  - type: textarea
    id: report
    attributes:
      label: Bug report from 'rpg report'
      description: "Type 'rpg report' in the terminal (or Rules tab, WRITE BUG REPORT) right after the problem. Drag the file BepInEx/LethalRPG-report-<date>_<time>.txt here, or paste its text. Reports from every player who saw the problem help most."
    validations:
      required: true
  - type: input
    id: profile-code
    attributes:
      label: Mod manager profile code (optional)
      description: "r2modman or Thunderstore Mod Manager: Settings, Profile, Export profile as code. Lets us load the same mods."
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy
      options:
        - label: I removed Steam names, Steam IDs and Windows user paths from everything I attached (the 'rpg report' file leaves them out already).
          required: true
