name: Balance feedback
description: An upgrade or skill feels too strong, too weak, too cheap or too slow.
title: "[Balance]: "
labels: ["balance"]
body:
  - type: markdown
    attributes:
      value: |
        Balance depends a lot on the host's settings, so please tell us which ones you played with. 'rpg info' in the terminal (or the Rules tab of the skill menu) shows them. Numbers help: prices, levels, XP per day, how many quotas you played.

        With 0.10.0 the host can let XP and skills belong to the save (`ProgressScope = Save`): everyone then starts a save with 0 XP and no skills. If your feedback is about XP or skills, tell us which way you played.
  - type: input
    id: version
    attributes:
      label: LethalRPG version
      placeholder: 0.10.0
    validations:
      required: true
  - type: input
    id: subject
    attributes:
      label: Which upgrade, skill or rule?
      placeholder: Vitality, Packmule, quota share, XP for kills, ...
    validations:
      required: true
  - type: dropdown
    id: difficulty
    attributes:
      label: Difficulty
      options:
        - Normal
        - Easy
        - Hard
    validations:
      required: true
  - type: dropdown
    id: balancing
    attributes:
      label: Balancing
      options:
        - Standard
        - Generous
        - Strict
    validations:
      required: true
  - type: dropdown
    id: ownership
    attributes:
      label: Upgrades
      options:
        - Individual (personal upgrades)
        - Team
  - type: dropdown
    id: currency
    attributes:
      label: Paid with
      options:
        - SurplusShare (budget from the quota surplus)
        - GroupCredits, SplitUpgradePrices off (full price)
        - GroupCredits with SplitUpgradePrices (personal upgrades only)
  - type: dropdown
    id: share-split
    attributes:
      label: Share split
      options:
        - ByContribution
        - Even
        - FullShareEach
        - Not used (team mode or group credits)
  - type: dropdown
    id: progress-scope
    attributes:
      label: Where XP and skills are kept (ProgressScope, new in 0.10.0)
      description: "'rpg info' (or the Rules tab) says it; the host's 'rpg report' has the line 'Progress:' under SESSION. With 'Per save' the SaveScopedSkills setting decides which skills belong to the save (Both, Unique or Ultimate)."
      options:
        - In profiles (ProgressScope Profile, the default)
        - Per save (ProgressScope Save), SaveScopedSkills Both
        - Per save (ProgressScope Save), SaveScopedSkills Unique or Ultimate
  - type: input
    id: other-settings
    attributes:
      label: Other host settings (optional)
      description: "Settings the host changed from their defaults, e.g. RulesPreset, SaveScopedSkills (new in 0.10.0), PriceShareCap, OverlapPolicy or RefundPercent. The host's 'rpg report' lists them under 'CONFIG OF THIS PC'."
      placeholder: PriceShareCap 2, OverlapPolicy PreferOtherMod
  - type: input
    id: crew
    attributes:
      label: Players and quotas played
      placeholder: 3 players, 6 quotas
  - type: textarea
    id: feedback
    attributes:
      label: What feels off?
      description: What you expected, and what happened in your games.
    validations:
      required: true
  - type: textarea
    id: suggestion
    attributes:
      label: Suggestion (optional)
      description: What would feel right to you?
