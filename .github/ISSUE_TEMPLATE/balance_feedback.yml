name: Balance feedback
description: An upgrade or skill feels too strong, too weak, too cheap or too slow.
title: "[Balance]: "
labels: ["balance"]
body:
  - type: markdown
    attributes:
      value: |
        Balance depends a lot on the host's settings, so please tell us which ones you played with. 'rpg info' in the terminal (or the Rules tab of the skill menu) shows them. Numbers help: prices, levels, XP per day, how many quotas you played.
  - type: input
    id: version
    attributes:
      label: LethalRPG version
      placeholder: 0.7.1
    validations:
      required: true
  - type: input
    id: subject
    attributes:
      label: Which upgrade, skill or rule?
      placeholder: Vitality, Packmule, quota share, XP for kills, ...
    validations:
      required: true
  - type: dropdown
    id: difficulty
    attributes:
      label: Difficulty
      options:
        - Normal
        - Easy
        - Hard
    validations:
      required: true
  - type: dropdown
    id: balancing
    attributes:
      label: Balancing
      options:
        - Standard
        - Generous
        - Strict
    validations:
      required: true
  - type: dropdown
    id: ownership
    attributes:
      label: Upgrades
      options:
        - Individual (personal upgrades)
        - Team
  - type: dropdown
    id: currency
    attributes:
      label: Paid with
      options:
        - SurplusShare (budget from the quota surplus)
        - GroupCredits
  - type: dropdown
    id: share-split
    attributes:
      label: Share split
      options:
        - ByContribution
        - Even
        - FullShareEach
        - Not used (team mode or group credits)
  - type: input
    id: crew
    attributes:
      label: Players and quotas played
      placeholder: 3 players, 6 quotas
  - type: textarea
    id: feedback
    attributes:
      label: What feels off?
      description: What you expected, and what happened in your games.
    validations:
      required: true
  - type: textarea
    id: suggestion
    attributes:
      label: Suggestion (optional)
      description: What would feel right to you?
