name: Bug report
description: Something in LethalRPG does not work as described, or LethalRPG breaks the game.
title: "[Bug]: "
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting! Please check **Known issues & limitations** in the [wiki](https://thunderstore.io/c/lethal-company/p/Cucumis/LethalRPG/wiki/) first.

        **In multiplayer, the host runs the self-test first:** `rpg selftest` in the terminal (or SELF-TEST on the Rules tab of the skill menu); wait until the page shows the result (usually within a second). It compares every player's LethalRPG with the host's. Then everyone who saw the problem types `rpg report`; the host's report has the result in its SELF-TEST section.

        **Privacy:** everything you write here is public. The `rpg report` file leaves out player names, Steam IDs and your Windows user folder. `LogOutput.log` does not: if you attach it, replace Steam names and paths like `C:\Users\<name>` first.
  - type: input
    id: version
    attributes:
      label: LethalRPG version
      description: "In the bug report ('rpg report'), under VERSIONS: the line 'LethalRPG 0.10.0+a1b2c3d, protocol 4'. Copy the version with its build, e.g. 0.10.0+a1b2c3d. If you went back to 0.9.0 or older, say so in 'What happened?'."
      placeholder: 0.10.0+a1b2c3d
    validations:
      required: true
  - type: dropdown
    id: role
    attributes:
      label: Your role
      options:
        - Host
        - Client
        - Singleplayer
    validations:
      required: true
  - type: dropdown
    id: network
    attributes:
      label: Steam or LAN
      options:
        - Steam
        - LAN
    validations:
      required: true
  - type: input
    id: players
    attributes:
      label: Players in the lobby
      description: "How many, and which LethalRPG version each of them has (0.10.x and 0.9.x do not work together). A client's 'rpg report' names the host's version under VERSIONS, in the line 'Host: ...'."
      placeholder: 3, all with LethalRPG 0.10.0
  - type: textarea
    id: rules
    attributes:
      label: Host settings
      description: "In the host's bug report ('rpg report'), under SESSION: the line 'Rules: ...'. The settings the host changed are under 'CONFIG OF THIS PC' in the same report."
      placeholder: "Rules: SurplusShare 50% ByContribution, Individual, skills Xp, Normal/Standard"
  - type: dropdown
    id: progress-scope
    attributes:
      label: Where XP and skills are kept (ProgressScope)
      description: "Matters for problems with XP, skills, resets, profiles or saves. In the host's bug report ('rpg report'), under SESSION: the line 'Progress: in profiles' or 'Progress: per save (SaveScopedSkills ...)'; the 'Rules:' line then has ', progress per save'. A change of ProgressScope applies the next time the host's PC hosts a save."
      options:
        - In profiles (ProgressScope Profile, the default)
        - Per save (ProgressScope Save)
        - Not sure
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What you did, what happened, and what you expected instead. Steps to make it happen again help a lot.
    validations:
      required: true
  - type: textarea
    id: report
    attributes:
      label: Bug report from 'rpg report'
      description: "Type 'rpg report' in the terminal (or Rules tab, WRITE BUG REPORT) right after the problem; in multiplayer the host runs 'rpg selftest' first (see above), so the report has its SELF-TEST section. Drag the file BepInEx/LethalRPG-report-<date>_<time>.txt here, or paste its text. Reports from every player who saw the problem help most."
    validations:
      required: true
  - type: input
    id: profile-code
    attributes:
      label: Mod manager profile code (optional)
      description: "r2modman or Thunderstore Mod Manager: Settings, Profile, Export profile as code. Lets us load the same mods."
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy
      options:
        - label: I removed Steam names, Steam IDs and Windows user paths from everything I attached (the 'rpg report' file leaves them out already).
          required: true
        - label: I understand that this issue is public and that I am responsible for what I post in it.
          required: true
